name: Update FC data

on:
  schedule:
    # Every four hours. FF Logs allows 3,600 points an hour and a run costs about
    # nine per member-zone, so one run reaches roughly 80 of 502 members; six runs a
    # day is what keeps the whole roster fresh. Each run resumes where the last
    # stopped, and the slower-moving sources (FFXIV Collect, Lalachievements) refresh
    # about once a day from cache rather than on every run.
    - cron: "30 */4 * * *"
  workflow_dispatch:
    inputs:
      full_history:
        description: "Sweep every savage tier ever released"
        type: boolean
        default: false
      full_extras:
        description: "Fetch nameday + race/clan for the whole roster in one run"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-fc-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Deliberately higher than the pipeline step's own timeout below. A *job* timeout
    # cancels the job outright and the commit step never runs, so a long pipeline would
    # throw away everything it had already fetched. Letting the step time out instead
    # keeps the job alive long enough to commit whatever did land.
    timeout-minutes: 330
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        timeout-minutes: 300
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
        run: |
          FLAGS=""
          # Only when asked. The weekly automatic sweep is gone: --full-history spends
          # the whole hourly FF Logs budget on a couple of dozen members and stalls the
          # rotating backfill that actually covers the roster.
          if [ "${{ inputs.full_history }}" = "true" ]; then
            FLAGS="$FLAGS --full-history"
          fi
          # full_extras ticked -> fetch race/clan + nameday for the whole roster at once
          if [ "${{ inputs.full_extras }}" = "true" ]; then
            FLAGS="$FLAGS --full-extras"
          fi
          python pipeline/update_members.py $FLAGS

      # commit new data -> push -> Vercel redeploys automatically.
      # always(): the pipeline checkpoints its progress to data/ as it goes, so even a
      # timed-out or failed run has partial results worth keeping — and the next run
      # resumes from them instead of starting over.
      - name: Commit & push if changed
        if: always()
        # Everything under data/ is generated from scratch each run, so on a clash
        # with what somebody pushed meanwhile this run's copy is simply the newer
        # read of the same sources — hence -X theirs, which during a rebase means the
        # commit being replayed. A plain "git pull --rebase" stopped on that conflict
        # and failed the run, losing an hour of FF Logs progress with it.
        run: |
          git config user.name "fc-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git commit -m "data: update $(date -u +%Y-%m-%d) [${{ job.status }}]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying (attempt $attempt)"
          done
          exit 1
